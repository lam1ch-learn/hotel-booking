server:
  port: ${GATEWAY_PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  datasource:
    url: jdbc:h2:mem:gateway;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 15s
security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:file:.work/keys/public.pem}
    issuer: ${JWT_ISSUER:hotel-booking}
    audience: ${JWT_AUDIENCE:hotel-api}
routes:
  booking: lb://booking-service
  hotel: lb://hotel-service
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_IP:127.0.0.1}
    lease-renewal-interval-in-seconds: 5
logging:
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health
