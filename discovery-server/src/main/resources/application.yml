server:
  port: ${DISCOVERY_PORT:8761}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  datasource:
    url: jdbc:h2:mem:discovery_server;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  application:
    name: discovery-server
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    response-cache-update-interval-ms: 1000
management:
  endpoints:
    web:
      exposure:
        include: health
